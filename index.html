<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Math RPG</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="game">

        <h1>🧮 Math RPG ⚔️</h1>


        <!-- Boss -->
        <section class="boss">

            <h2>👹 Boss</h2>

            <div class="hp-text" id="boss-hp-text">
                Boss HP：100 / 100
            </div>

            <div class="hp-bar">
                <div id="boss-hp-bar"></div>
            </div>

        </section>


        <!-- 戰鬥區 -->
        <section class="battle">

            <div id="question-number">
                尚未開始遊戲
            </div>


            <!-- 倒數計時 -->
            <div id="timer">
                ⏱️ 20 秒
            </div>


            <div id="question">
                準備好挑戰 Boss 了嗎？
            </div>


            <div class="answer-area">

                <input
                    id="answer"
                    type="number"
                    placeholder="輸入答案"
                    disabled
                >

                <button id="attack" disabled>
                    ⚔️ 發動攻擊
                </button>

            </div>


            <!-- 開始遊戲 -->
            <button id="start-game">
                🎮 開始遊戲
            </button>

        </section>


        <!-- 戰鬥訊息 -->
        <div id="message">
            🧮 按下「開始遊戲」開始挑戰！
        </div>


        <!-- 玩家 -->
        <section class="player">

            <h2>🧙 玩家</h2>

            <div class="hp-text" id="player-hp-text">
                玩家 HP：60 / 60
            </div>

            <div class="hp-bar">
                <div id="player-hp-bar"></div>
            </div>

            <div id="mistakes">
                ❌ 錯誤次數：0 / 3
            </div>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
